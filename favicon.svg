<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Smalto Cobalto Vietrese Profondo -->
    <linearGradient id="cobaltGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#104E8B"/>
      <stop offset="50%" stop-color="#0A3764"/>
      <stop offset="100%" stop-color="#052242"/>
    </linearGradient>
    <!-- Oro / Ocra Vietri -->
    <linearGradient id="goldDeco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Piastrella Ceramica Maiolicata a forma Squircle (Pieno spazio, visibilità massima) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#cobaltGlaze)" stroke="#D99B26" stroke-width="14"/>

  <!-- Filetto decorativo sottile stile ceramica artigianale -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Monogramma Tipografico AS (Antonio Solimene) -->
  <text x="256" y="345" 
        font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif" 
        font-size="285" 
        font-weight="700" 
        letter-spacing="-12" 
        text-anchor="middle" 
        fill="#FFFFFF">
    AS
  </text>

  <!-- Dettaglio Bottega d'Autore: Piccolo punto smalto ceramico Ocra / Cotto -->
  <circle cx="256" cy="405" r="16" fill="url(#goldDeco)"/>
</svg>