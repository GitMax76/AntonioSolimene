<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F477E"/>
      <stop offset="100%" stop-color="#062343"/>
    </linearGradient>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#E8DECE"/>
    </linearGradient>
    <linearGradient id="cottoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E26C42"/>
      <stop offset="100%" stop-color="#B44A24"/>
    </linearGradient>
  </defs>

  <!-- Sfondo Circolare Cobalto Vietrese -->
  <circle cx="256" cy="256" r="246" fill="url(#cobaltGrad)" stroke="#D99B26" stroke-width="12"/>

  <!-- Cerchio decorativo interno sottile (Tradizione Maiolica) -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#FAF7F2" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8 8"/>

  <!-- Vaso / Anfora Forgiata al Tornio -->
  <g id="amphora" transform="translate(0, 5)">
    <!-- Bocca del Vaso -->
    <ellipse cx="256" cy="135" rx="58" ry="15" fill="url(#clayGrad)"/>
    <ellipse cx="256" cy="135" rx="46" ry="10" fill="#0A3764" opacity="0.4"/>

    <!-- Collo e Corpo Vaso -->
    <path d="M212 135 C214 175, 218 198, 188 232 C154 270, 154 330, 192 370 C220 400, 240 408, 256 408 C272 408, 292 400, 320 370 C358 330, 358 270, 324 232 C294 198, 298 175, 300 135 Z" 
          fill="url(#clayGrad)" />

    <!-- Fascia Cotto Vietri -->
    <path d="M174 282 C196 302, 228 310, 256 310 C284 310, 316 302, 338 282 C340 298, 335 315, 324 330 C302 345, 276 352, 256 352 C236 352, 210 345, 188 330 C177 315, 172 298, 174 282 Z" 
          fill="url(#cottoGrad)" />

    <!-- Sole / Spirale Tornio -->
    <circle cx="256" cy="265" r="18" fill="#D99B26" />
    <circle cx="256" cy="265" r="9" fill="#0A3764" />

    <!-- Manici Volute Anfora -->
    <path d="M204 165 C158 165, 144 212, 182 248 C186 242, 191 236, 195 231 C170 206, 176 182, 204 178 Z" fill="url(#clayGrad)"/>
    <path d="M308 165 C354 165, 368 212, 330 248 C326 242, 321 236, 317 231 C342 206, 336 182, 308 178 Z" fill="url(#clayGrad)"/>

    <!-- Piede del Vaso -->
    <path d="M222 408 L212 430 C212 434, 300 434, 300 430 L290 408 Z" fill="url(#clayGrad)"/>
  </g>
</svg>